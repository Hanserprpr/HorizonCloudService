# 用户服务配置文件
environment: "development"  # development, production
port: 8081

# 数据库配置
database:
  host: "localhost"
  port: 3306
  username: "root"
  password: "12345678"
  dbname: "horizon_cloud_users"

# Redis配置
redis:
  host: "localhost"
  port: 6379
  password: "12345678"
  db: 1  # 用户服务专用数据库

# JWT配置
jwt:
  access_secret: "user-service-access-secret-32-chars"
  refresh_secret: "user-service-refresh-secret-32-char"
  access_expire: 3600    # 1小时 (秒)
  refresh_expire: 604800 # 7天 (秒)

# 日志配置
log:
  level: "info"
  file_path: "/var/log/user-service.log"
  max_size: 100      # MB
  max_backups: 3
  max_age: 28        # 天
  compress: false